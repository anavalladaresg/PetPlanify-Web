<div class="layout-container">
    <!-- Dashboard lateral -->
    <div class="dashboard">
        <div class="logo-container">
            <img src="assets/logo.png" alt="PetPlanify Logo" class="logo-image">
        </div>
        
        <nav class="menu">
            <ul>
                <li class="menu-item" [class.active]="currentView === 'welcome'" (click)="navigateTo('welcome')">
                    <i class="pi pi-home"></i>
                    <span>Inicio</span>
                </li>
                <li class="menu-item" [class.active]="currentView === 'pets'" (click)="navigateTo('pets')">
                    <i class="pi pi-user"></i>
                    <span>Mis Mascotas</span>
                </li>
                <li class="menu-item" [class.active]="currentView === 'events'" (click)="navigateTo('events')">
                    <i class="pi pi-calendar"></i>
                    <span>Eventos</span>
                </li>
                <li class="menu-item" [class.active]="currentView === 'health'" (click)="navigateTo('health')">
                    <i class="pi pi-heart"></i>
                    <span>Salud</span>
                </li>
                <li class="menu-item" [class.active]="currentView === 'pet-friendly'" (click)="navigateTo('pet-friendly')">
                    <i class="pi pi-map-marker"></i>
                    <span>Lugares Pet-Friendly</span>
                </li>
                <li class="menu-item" [class.active]="currentView === 'settings'" (click)="navigateTo('settings')">
                    <i class="pi pi-cog"></i>
                    <span>Configuración</span>
                </li>
            </ul>
        </nav>

        <div class="logout-container">
            <button class="logout-button" (click)="logout()">
                <i class="pi pi-sign-out"></i>
                <span>Cerrar Sesión</span>
            </button>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="background">
            <div class="radial-gradient"></div>
        </div>
        <div class="content">
            <div *ngIf="currentView === 'welcome'" class="welcome-content">
                <h1>¡Bienvenido a PetPlanify!</h1>
                <p>Tu plataforma integral para el cuidado de tus mascotas</p>
            </div>
            <div *ngIf="currentView === 'pets'" class="pets-content">
                <h2>Mis Mascotas</h2>
                <button class="add-pet-btn-icon" (click)="showAddPetForm = true" title="Nueva mascota">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" stroke="#47824b" fill="#fff"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v8m4-4H8" stroke="#47824b"/>
                    </svg>
                </button>
                <div *ngIf="showAddPetForm" class="add-pet-modal-backdrop">
                    <div class="add-pet-modal">
                        <button class="close-modal-btn" (click)="showAddPetForm = false" title="Cerrar">&times;</button>
                        <form (ngSubmit)="addPet()" #petForm="ngForm">
                            <h3>Nueva Mascota</h3>
                            <div class="form-row">
                                <label>Nombre:</label>
                                <input type="text" name="nombre" [(ngModel)]="newPet.nombre" required />
                            </div>
                            <div class="form-row">
                                <label>Tipo:</label>
                                <select name="tipo" [(ngModel)]="newPet.tipo" (change)="onTipoChange()" required>
                                    <option value="">Selecciona tipo</option>
                                    <option value="perro">Perro</option>
                                    <option value="gato">Gato</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label>Raza:</label>
                                <select name="raza" [(ngModel)]="newPet.raza" required>
                                    <option *ngFor="let raza of razasDisponibles" [value]="raza">{{ raza }}</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label>Fecha de nacimiento:</label>
                                <input type="date" name="fechaNacimiento" [(ngModel)]="newPet.fechaNacimiento" required />
                            </div>
                            <div class="form-row">
                                <label>Peso (kg):</label>
                                <input type="number" name="peso" [(ngModel)]="newPet.peso" min="0" step="0.01" required />
                            </div>
                            <div class="form-row">
                                <label>Foto:</label>
                                <input type="file" name="foto" (change)="onFotoChange($event)" accept="image/*" />
                            </div>
                            <div class="form-row form-actions-row">
                                <button type="submit" class="save-btn">Guardar Mascota</button>
                                <button type="button" class="cancel-btn" (click)="showAddPetForm = false">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Aquí irá el contenido de mascotas -->
            </div>
            <div *ngIf="currentView === 'events'" class="events-content">
                <h2>Eventos</h2>
                <!-- Aquí irá el contenido de eventos -->
            </div>
            <div *ngIf="currentView === 'health'" class="health-content">
                <h2>Salud</h2>
                <!-- Aquí irá el contenido de salud -->
            </div>
            <div *ngIf="currentView === 'pet-friendly'" class="pet-friendly-content">
                <h2>Lugares Pet-Friendly</h2>
                <!-- Aquí irá el contenido de lugares pet-friendly -->
            </div>
            <div *ngIf="currentView === 'settings'" class="settings-content">
                <h2>Configuración</h2>
                <!-- Aquí irá el contenido de configuración -->
            </div>
        </div>
    </div>
</div>
