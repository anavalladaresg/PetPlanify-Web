<div class="login-container">
    <div class="logo-container" [routerLink]="['/']">
        <img src="/logo.png" alt="PetPlanify Logo" class="logo-image">
    </div>
    
    <div class="auth-content">
        <h1 class="auth-title">¡Bienvenido de nuevo!</h1>
        <p class="auth-subtitle">Accede a tu cuenta y mantén al día el cuidado de tus mascotas</p>
        
        <p-card styleClass="login-card">
            <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
                <div class="form-field">
                    <p-floatLabel variant="on">
                        <input pInputText id="email" [(ngModel)]="formData.email" name="email" type="email" required autocomplete="off" />
                        <label for="email">Email</label>
                    </p-floatLabel>
                </div>

                <div class="form-field">
                    <p-floatLabel variant="on">
                        <p-password id="password" [(ngModel)]="formData.password" name="password" 
                            [toggleMask]="true" [feedback]="false" required>
                        </p-password>
                        <label for="password">Contraseña</label>
                    </p-floatLabel>
                </div>

                <div *ngIf="errorMessage" class="error-message">
                    {{ errorMessage }}
                </div>

                <div class="form-actions">
                    <p-button type="submit" label="Iniciar Sesión" styleClass="p-button-success"></p-button>
                </div>

                <div class="auth-footer">
                    <p>¿No tienes una cuenta? <a [routerLink]="['/registro']">Regístrate</a></p>
                </div>
            </form>
        </p-card>
    </div>
</div>
