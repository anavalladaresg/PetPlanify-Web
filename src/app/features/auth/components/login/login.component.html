<!-- Fondo difuminado -->
<div class="login-bg"></div>
<div class="login-container">
    <div class="auth-content">
        <div class="logo-content">
            <img src="assets/logo.png" alt="PetPlanify Logo">
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <h1 class="auth-title">
                <span class="paw-svg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-paw-print-icon lucide-paw-print">
                        <circle cx="11" cy="4" r="2" />
                        <circle cx="18" cy="8" r="2" />
                        <circle cx="20" cy="16" r="2" />
                        <path
                            d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
                    </svg>
                </span>
                ¡Bienvenido de nuevo!
            </h1>
            <p class="auth-subtitle">
                Accede a tu cuenta y mantén al día el cuidado de tus mascotas
            </p>
            <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
                <div class="form-field">
                    <span class="p-input-icon-left wide-input" style="width:100%">
                        <i class="pi pi-user"></i>
                        <input pInputText id="email" [(ngModel)]="formData.email" name="email" type="email"
                            autocomplete="off" required placeholder="Correo electrónico">
                    </span>
                </div>
                <div class="form-field">
                    <span class="p-input-icon-left wide-input" style="width:100%">
                        <i class="pi pi-lock"></i>
                        <input pInputText id="password" [(ngModel)]="formData.password" name="password" type="password"
                            autocomplete="off" required placeholder="Contraseña">
                    </span>
                </div>
                <div class="form-actions">
                    <p-button type="submit" label="Iniciar sesión" styleClass="p-button-success"></p-button>
                </div>
                <div class="auth-footer">
                    ¿No tienes una cuenta? <a [routerLink]="['/registro']">Regístrate<i class="pi pi-paw"></i></a>
                </div>
            </form>
        </div>
    </div>
</div>
<p-toast position="top-right"></p-toast>
