<!-- Fondo difuminado -->
<div class="login-bg"></div>
<div class="login-container align-right">
    <div class="auth-content align-right">
        <div class="logo-content align-right">
            <img src="assets/logo.png" alt="PetPlanify Logo">
        </div>
        <h1 class="auth-title align-right">
            <span class="paw-svg">
                <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-paw-print-icon lucide-paw-print">
                    <circle cx="11" cy="4" r="2" />
                    <circle cx="18" cy="8" r="2" />
                    <circle cx="20" cy="16" r="2" />
                    <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
                </svg>
            </span>
            ¡Bienvenido a PetPlanify!
        </h1>
        <p class="auth-subtitle align-right">Registra tu cuenta y comienza a gestionar el cuidado de tus mascotas de forma fácil y organizada</p>
        <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="login-form align-right">
            <div class="form-row">
                <div class="form-field half-width">
                    <span class="p-input-icon-left wide-input" style="width:100%">
                        <i class="pi pi-user"></i>
                        <input pInputText id="nombre" [(ngModel)]="formData.nombre" name="nombre" required autocomplete="off" placeholder="Nombre del propietario">
                    </span>
                </div>
                <div class="form-field half-width">
                    <span class="p-input-icon-left wide-input" style="width:100%">
                        <i class="pi pi-envelope"></i>
                        <input pInputText id="email" [(ngModel)]="formData.email" name="email" type="email" required autocomplete="off" placeholder="Correo electrónico">
                    </span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-field half-width">
                    <span class="p-input-icon-left wide-input" style="width:100%">
                        <span class="custom-lock-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                            </svg>
                        </span>
                        <p-password id="password" [(ngModel)]="formData.password" name="password" [toggleMask]="true" [feedback]="true" required placeholder="Contraseña"></p-password>
                    </span>
                </div>
                <div class="form-field half-width">
                    <span class="p-input-icon-left wide-input" style="width:100%">
                        <span class="custom-lock-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                            </svg>
                        </span>
                        <p-password id="confirmPassword" [(ngModel)]="formData.confirmPassword" name="confirmPassword" [toggleMask]="true" feedback="false" required placeholder="Confirmar Contraseña"></p-password>
                    </span>
                </div>
            </div>
            <div class="form-actions">
                <p-button type="submit" label="Registrarse" styleClass="p-button-success"></p-button>
            </div>
            <div class="auth-footer">
                ¿Ya tienes una cuenta? <a [routerLink]="['/login']">Inicia sesión<i class="pi pi-paw"></i></a>
            </div>
        </form>
    </div>
</div>
